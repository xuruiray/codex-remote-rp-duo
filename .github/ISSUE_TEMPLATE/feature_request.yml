name: 功能建议
description: 描述希望改善的使用场景和交互。
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到什么问题
      description: 描述具体任务、操作步骤和不便之处。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 说明上屏或下屏怎样工作；如有参考项目，请提供具体页面链接。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法或补充说明
